version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trivia:trivia@db:5432/trivia_db
      BETTER_AUTH_SECRET: dev-secret-change-in-production-min32
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      NODE_ENV: development
    command: >
      sh -c "
        echo '▶ Running migrations...' &&
        npx drizzle-kit migrate &&
        echo '▶ Creating admin user...' &&
        npx tsx scripts/create-admin.ts &&
        echo '▶ Starting dev server...' &&
        npm run dev
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trivia_dev

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
      POSTGRES_DB: trivia_db
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d trivia_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trivia_dev

volumes:
  pgdata_dev:

networks:
  trivia_dev:
    driver: bridge
