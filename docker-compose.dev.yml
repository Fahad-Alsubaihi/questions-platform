version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trivia:trivia@db:5432/trivia_db
      BETTER_AUTH_SECRET: dev-secret-change-in-production-min32
      BETTER_AUTH_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trivia_dev

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
      POSTGRES_DB: trivia_db
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d trivia_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trivia_dev

volumes:
  pgdata_dev:

networks:
  trivia_dev:
    driver: bridge
